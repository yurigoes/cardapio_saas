# ─────────────────────────────────────────────────────────────────────────────
# RETAGUARDA do Three Digital — stack completo no mini-PC da loja
#
#   nginx-cache  proxy + cache 3 zonas (html/media/static)
#   redis        buffer offline + idempotency
#   worker       enfileira POSTs quando master cai + drainer
#   purger       invalida cache HTML quando master pede
#   cloudflared  HTTPS público via Cloudflare Tunnel (sem IP fixo)
#   reporter     heartbeat 60s + métricas pro master
#   watchtower   auto-update das imagens (opcional)
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  nginx-cache:
    image: nginx:1.27-alpine
    container_name: retaguarda_nginx
    restart: unless-stopped
    ports:
      - "${LISTEN_HTTP:-80}:80"
      - "${LISTEN_HTTPS:-443}:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - cache_html:/var/cache/nginx/html
      - cache_media:/var/cache/nginx/media
      - cache_static:/var/cache/nginx/static
      - ./certs:/etc/nginx/certs:ro
    environment:
      MASTER_URL:        "${MASTER_URL}"
      MASTER_HOST:       "${MASTER_HOST}"
      RETAGUARDA_DOMAIN: "${RETAGUARDA_DOMAIN}"
      EMPRESA_SLUG:      "${EMPRESA_SLUG}"
      CACHE_MAX_HTML:    "${CACHE_MAX_HTML:-200m}"
      CACHE_MAX_MEDIA:   "${CACHE_MAX_MEDIA:-5g}"
      CACHE_MAX_STATIC:  "${CACHE_MAX_STATIC:-500m}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/__retaguarda_health"]
      interval: 30s
      timeout:  5s
      retries:  3
    networks: [retaguarda]
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "5" }

  redis:
    image: redis:7-alpine
    container_name: retaguarda_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks: [retaguarda]
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "3" }

  worker:
    build: ./worker
    container_name: retaguarda_worker
    restart: unless-stopped
    environment:
      MASTER_URL: "${MASTER_URL}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DRAIN_INTERVAL_MS: "5000"
      MAX_ATTEMPTS: "20"
      REQUEST_TIMEOUT: "15000"
    depends_on: [redis]
    networks: [retaguarda]
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "5" }

  # Purger — recebe POST /__purge do master pra invalidar cache HTML.
  # Acesso só pela rede interna (nginx faz proxy). Auth: X-Purge-Secret =
  # HEARTBEAT_SECRET (mesmo trust boundary).
  purger:
    build: ./purger
    container_name: retaguarda_purger
    restart: unless-stopped
    environment:
      PURGE_SECRET: "${HEARTBEAT_SECRET}"
    volumes:
      - cache_html:/cache/html
      - cache_media:/cache/media:ro
      - cache_static:/cache/static:ro
    networks: [retaguarda]
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: retaguarda_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN}"
    depends_on: [nginx-cache]
    networks: [retaguarda]
    # cloudflared imagem distroless não tem wget/curl pra healthcheck.
    # Confiamos no restart policy + monitoramento externo via /admin/retaguardas
    # (master detecta tunnel down se heartbeats pararem).
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "3" }

  # Reporter — Node script que coleta métricas (worker + purger) e manda
  # heartbeat rico pro master a cada 60s. Substitui o reporter curl.
  reporter:
    build: ./reporter
    container_name: retaguarda_reporter
    restart: unless-stopped
    environment:
      MASTER_URL:       "${MASTER_URL}"
      EMPRESA_SLUG:     "${EMPRESA_SLUG}"
      RETAGUARDA_ID:    "${RETAGUARDA_ID}"
      HEARTBEAT_SECRET: "${HEARTBEAT_SECRET}"
      WORKER_URL:       "http://worker:3001"
      PURGER_URL:       "http://purger:3002"
      INTERVAL_SEC:     "60"
    depends_on: [worker, purger]
    networks: [retaguarda]
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "3" }

  # Auto-update das imagens. Olha o Docker Hub a cada 12h e atualiza
  # qualquer container que tenha image: nome:tag (não puxa de build).
  # Opcional — comente o bloco se preferir update manual.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: retaguarda_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP:           "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_POLL_INTERVAL:     "43200"  # 12h
      # Sem LABEL_ENABLE: atualiza todos os containers cujas imagens existem
      # no registry (nginx, redis, cloudflared, watchtower). Containers
      # com 'build:' (worker/purger/reporter) são pulados automaticamente.
    networks: [retaguarda]
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "3" }

volumes:
  cache_html:
  cache_media:
  cache_static:
  redis_data:

networks:
  retaguarda:
    driver: bridge
