name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    name: Lint + Vitest unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint
        continue-on-error: true   # warnings não falham CI

      - name: Vitest unit
        run: npm run test
