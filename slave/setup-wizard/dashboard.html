<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio SaaS — Slave Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .brand { font-size: 18px; font-weight: 800; }
    .brand span { color: #10b981; }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.online { background: #10b981; animation: pulse 2s infinite; }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.5; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 22px;
    }
    .card-label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; }
    .card-value { font-size: 28px; font-weight: 800; margin-top: 6px; }
    .card-sub   { font-size: 12px; color: #64748b; margin-top: 4px; }
    .card-value.green { color: #10b981; }
    .card-value.yellow { color: #f59e0b; }
    .card-value.red   { color: #ef4444; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary  { background: #10b981; color: white; }
    .btn-primary:hover { background: #059669; }
    .btn-danger   { background: #1e293b; color: #ef4444; border: 1px solid #ef4444; }
    .btn-danger:hover { background: #1f0a0a; }
    .btn-secondary { background: #334155; color: #cbd5e1; }
    .btn-secondary:hover { background: #475569; }
    .log-box {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      color: #64748b;
      height: 160px;
      overflow-y: auto;
    }
    .log-line.ok   { color: #10b981; }
    .log-line.warn { color: #f59e0b; }
    .log-line.err  { color: #ef4444; }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">Cardápio <span>SaaS</span> — Slave</div>
  <div class="status-pill">
    <div class="dot" id="dot"></div>
    <span id="status-text">Verificando...</span>
  </div>
</header>

<div class="grid">
  <div class="card">
    <div class="card-label">Status da conexão</div>
    <div class="card-value green" id="val-connected">—</div>
    <div class="card-sub" id="val-last-sync">Último sync: —</div>
  </div>
  <div class="card">
    <div class="card-label">Pedidos pendentes</div>
    <div class="card-value yellow" id="val-pedidos">—</div>
    <div class="card-sub">aguardando impressão</div>
  </div>
  <div class="card">
    <div class="card-label">Empresa</div>
    <div class="card-value" style="font-size:18px" id="val-empresa">—</div>
    <div class="card-sub" id="val-cloud">—</div>
  </div>
</div>

<div class="actions">
  <button class="btn btn-primary" onclick="openApp()">🔗 Abrir no navegador</button>
  <button class="btn btn-secondary" onclick="testPrint()">🖨️ Teste de impressão</button>
  <button class="btn btn-secondary" onclick="forceSync()">🔄 Sincronizar agora</button>
  <button class="btn btn-danger" onclick="resetConfig()">⚙️ Reconfigurar</button>
</div>

<div class="section-title">Log de atividade</div>
<div class="log-box" id="log-box">
  <div class="log-line">Iniciando...</div>
</div>

<script>
  let cloudUrl = '';

  function addLog(msg, type = '') {
    const box = document.getElementById('log-box');
    const line = document.createElement('div');
    line.className = 'log-line' + (type ? ' ' + type : '');
    line.textContent = '[' + new Date().toLocaleTimeString('pt-BR') + '] ' + msg;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
    // Mantém apenas últimas 100 linhas
    while (box.children.length > 100) box.removeChild(box.firstChild);
  }

  async function updateStatus() {
    try {
      const s = await fetch('/api/status').then(r => r.json());
      cloudUrl = s.cloudUrl || '';

      const dot = document.getElementById('dot');
      const txt = document.getElementById('status-text');
      if (s.connected) {
        dot.className = 'dot online';
        txt.textContent = 'Online';
        document.getElementById('val-connected').textContent = '● Online';
        document.getElementById('val-connected').className = 'card-value green';
      } else {
        dot.className = 'dot';
        txt.textContent = 'Offline';
        document.getElementById('val-connected').textContent = '○ Offline';
        document.getElementById('val-connected').className = 'card-value red';
      }

      if (s.lastSync) {
        const d = new Date(s.lastSync);
        document.getElementById('val-last-sync').textContent = 'Último sync: ' + d.toLocaleTimeString('pt-BR');
      }

      document.getElementById('val-empresa').textContent = s.empresaSlug || '—';
      document.getElementById('val-cloud').textContent = s.cloudUrl || '—';

    } catch { /* offline */ }
  }

  async function updatePedidos() {
    try {
      const data = await fetch('/api/pedidos/pendentes').then(r => r.json());
      const count = Array.isArray(data.data) ? data.data.length : 0;
      document.getElementById('val-pedidos').textContent = count;
      if (count > 0) addLog(`${count} pedido(s) pendente(s) de impressão`, 'warn');
    } catch { }
  }

  async function testPrint() {
    addLog('Enviando teste para impressora...');
    try {
      const r = await fetch('/api/print/test', { method: 'POST' });
      const d = await r.json();
      if (d.success) addLog('✔ Teste enviado com sucesso', 'ok');
      else addLog('✖ Erro: ' + (d.error || 'desconhecido'), 'err');
    } catch (err) {
      addLog('✖ ' + err.message, 'err');
    }
  }

  async function forceSync() {
    addLog('Sincronizando com a nuvem...');
    await updateStatus();
    await updatePedidos();
    addLog('Sync concluído', 'ok');
  }

  function openApp() {
    if (cloudUrl) window.open(cloudUrl + '/painel', '_blank');
    else alert('URL da nuvem não configurada');
  }

  function resetConfig() {
    if (!confirm('Remover configuração atual e reiniciar setup?')) return;
    fetch('/api/reset', { method: 'POST' }).then(() => {
      window.location.href = '/';
    });
  }

  // Atualiza a cada 5s
  updateStatus();
  updatePedidos();
  setInterval(() => { updateStatus(); updatePedidos(); }, 5000);
  addLog('Dashboard carregado', 'ok');
</script>
</body>
</html>
