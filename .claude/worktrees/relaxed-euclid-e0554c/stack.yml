version: "3.8"

services:
  # ─────────────────────────────────────────────
  # PostgreSQL — banco principal
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "{{secrets.DB_NAME}}"
      POSTGRES_USER: "{{secrets.DB_USER}}"
      POSTGRES_PASSWORD: "{{secrets.DB_PASSWORD}}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yugonet
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      restart_policy:
        condition: any
        delay: 10s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis — cache e sessões
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass "{{secrets.REDIS_PASSWORD}}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - yugonet
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s

  # ─────────────────────────────────────────────
  # Aplicação — cardápio SaaS
  # ─────────────────────────────────────────────
  cardapio_saas:
    image: cardapio_saas:latest
    pull_policy: never
    networks:
      - yugonet
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_BASE_DOMAIN=cardapio.yugochat.com.br
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    secrets:
      - db_password
      - redis_password
      - jwt_secret
      - jwt_refresh_secret
      - encryption_key
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=yugonet"
        # Rotas principais + subdomínios
        - "traefik.http.routers.cardapio_saas.rule=Host(`cardapio.yugochat.com.br`) || HostRegexp(`{subdomain:[a-z0-9-]+}.cardapio.yugochat.com.br`)"
        - "traefik.http.routers.cardapio_saas.entrypoints=websecure"
        - "traefik.http.routers.cardapio_saas.tls=true"
        - "traefik.http.routers.cardapio_saas.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.cardapio_saas.loadbalancer.server.port=3000"
        # Middlewares de segurança
        - "traefik.http.routers.cardapio_saas.middlewares=secure-headers@docker,rate-limit@docker"
        # Security headers
        - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
        - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
        - "traefik.http.middlewares.secure-headers.headers.stsPreload=true"
        - "traefik.http.middlewares.secure-headers.headers.forceSTSHeader=true"
        - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
        - "traefik.http.middlewares.secure-headers.headers.browserXssFilter=true"
        - "traefik.http.middlewares.secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
        - "traefik.http.middlewares.secure-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
        # Rate limiting
        - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
        - "traefik.http.middlewares.rate-limit.ratelimit.burst=50"
        - "traefik.http.middlewares.rate-limit.ratelimit.period=1m"

secrets:
  db_password:
    external: true
  redis_password:
    external: true
  jwt_secret:
    external: true
  jwt_refresh_secret:
    external: true
  encryption_key:
    external: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  yugonet:
    external: true
