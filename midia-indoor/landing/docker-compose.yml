# ─────────────────────────────────────────────────────────────────────────────
# Three Digital Mídia — Landing/SaaS self-service
#
# Roda na MESMA VPS, isolado. Bind em 127.0.0.1:3100 → Cloudflare Tunnel
# roteia midiaindoor.tthreedigital.com.br → localhost:3100.
#
# Redes (a landing entra em DUAS redes externas):
#   - midia_net  → criada pelo stack do Xibo. Fala com o CMS por dentro via
#                  http://midia_xibo_web (XIBO_URL no .env).
#   - cardapio_net → rede do stack do restaurante, onde roda o Postgres em
#                    container. DATABASE_URL usa o NOME DO CONTAINER do Postgres,
#                    ex: postgres://user:senha@cardapio_db:5432/cardapio_saas
#
# ⚠️ Confirme o nome da rede do restaurante e do container do Postgres:
#     docker network ls
#     docker ps --format '{{.Names}}' | grep -iE 'postg|db'
#   Se a rede NÃO se chamar "cardapio_net", edite o bloco `networks` no fim.
#
# Subir:
#   1. cp .env.example .env  e preencher (DATABASE_URL, JWT_SECRET, XIBO_*, MP_ACCESS_TOKEN)
#   2. docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  landing:
    build: .
    image: midia_landing:latest
    container_name: midia_landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    env_file: .env
    mem_limit: 512m
    networks: [midia_net, cardapio_net]
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

networks:
  midia_net:
    external: true
    name: midia_net
  # ↓ ajuste "name" pro nome real da rede do stack do restaurante
  cardapio_net:
    external: true
    name: cardapio_net
